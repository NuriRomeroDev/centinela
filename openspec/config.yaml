# openspec/config.yaml — SDD project configuration for centinela
schema: spec-driven

context: |
  Centinela: fullstack technical test delivery — banking reconciliation & idempotency control platform.
  Frontend: React + PrimeReact (TypeScript). Mock design source: plantilla.html (Centinela dashboard: KPIs,
    throughput chart, status distribution, recent error logs, virtualized logs list w/ 300ms debounce search,
    sync explorer w/ expandable files, remediation history, stack-trace modal w/ focus trap).
  Backend: Python FastAPI (async) — idempotency via SHA-256 checksum, async CPU-heavy processing via executors,
    N+1 mitigation via SQLAlchemy selectinload, retry with exponential backoff + jitter for PostgreSQL outages.
  Database: PostgreSQL — 4 tables (sincronizaciones, archivos_procesados, logs_errores, acciones_remediacion),
    UUIDs, enums, unique checksum, composite indexes.
  DevOps: docker-compose.yml with network isolation (frontend net, db net, backend bridges both);
    /scripts up.sh, clean.sh, test.sh; declarative Jenkinsfile (checkout, lint, unit tests 80% coverage, docker build).
  Conventions: conventional commits; no AI attribution in commit messages.

testing:
  strict_tdd: true
  backend:
    runner: pytest
    framework: pytest + pytest-asyncio
    coverage_command: pytest --cov --cov-fail-under=80
  frontend:
    runner: npm test
    framework: Vitest + React Testing Library
    coverage_command: vitest run --coverage

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "pytest (backend) / npm test (frontend)"
  verify:
    test_command: "pytest && npm test"
    build_command: "docker compose build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
