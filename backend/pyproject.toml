[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centinela-backend"
version = "0.1.0"
description = "Centinela backend — banking reconciliation & idempotency control platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.8",
    "httpx>=0.27",
    "flake8>=7.1",
    "black>=24.10",
    "coverage>=7.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "--cov=app --cov-report=term-missing"
# NOTE: the 80% coverage gate (--cov-fail-under=80) is enforced by scripts/test.sh
# and the Jenkinsfile (Batch 4) — not baked into addopts so per-task TDD cycles
# stay green while coverage accumulates across batches.

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/api/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
# ruff is not used; flake8 config lives in .flake8 (flake8 cannot read pyproject.toml).
